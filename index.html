<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一年级学习乐园</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#203040;background:#eef7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#eaf7ff,#fff7e8);padding:24px}
main{max-width:860px;margin:auto}header{padding:24px 4px 18px}h1{margin:0;font-size:32px}p{color:#587080}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{display:block;padding:24px;border-radius:18px;background:#fff;box-shadow:0 8px 24px #355b7420;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #355b7430}.icon{font-size:42px}.card h2{margin:12px 0 8px}.card p{margin:0;line-height:1.6}.note{margin-top:24px;font-size:14px;color:#71808a}
</style>
</head>
<body><main>
<header><h1>一年级学习乐园</h1><p>认字、数学和后续新增的一年级学习内容，都从这里进入。</p></header>
<section class="grid" aria-label="学习内容">
<a class="card" href="./认字游戏/"><div class="icon">❄️</div><h2>认字游戏</h2><p>冰雪主题与《玩具总动员》主题，四选一、拼音、组词和错题复习。</p></a>
<a class="card" href="./数学游戏/"><div class="icon">➕</div><h2>数学游戏</h2><p>按一年级进度练习 10 以内加减法，并逐步加入 20 以内题型。</p></a>
</section><p class="note">后续学习模块会继续添加到这里。</p>
</main></body></html>
