<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>一年级学习乐园 · 认字游戏</title>
<style>
:root{
  --ice1:#eaf7ff;--ice2:#cdeeff;--ice3:#9fd9ff;--deep:#2f7bd1;--navy:#1f3a5f;
  --gold:#ffcf5c;--pink:#ff9fc6;--mint:#7fe3c4;--violet:#b49cf2;--paper:#ffffff;
  --ok:#49c98b;--bad:#ff7e93;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow-x:hidden;position:relative;transition:background .4s ease}
body.theme-ice{
  --deep:#2f7bd1;--navy:#1f3a5f;--gold:#ffcf5c;--pink:#ff9fc6;--mint:#7fe3c4;--violet:#b49cf2;
  background:linear-gradient(180deg,#dff1ff 0%,#eef8ff 45%,#f8fcff 100%);
}
body.theme-toy{
  --deep:#ff7a45;--navy:#5a3a1f;--gold:#ffd166;--pink:#ff6f91;--mint:#5bc8af;--violet:#9c7bd6;
  background:linear-gradient(180deg,#fff3e0 0%,#fff8ec 45%,#fffdf7 100%);
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.flake{position:absolute;top:-10%;color:#cfeeff;opacity:.85;text-shadow:0 0 4px #fff;animation:fall linear infinite}
.star{position:absolute;color:var(--gold);opacity:0;animation:twinkle ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-8vh) translateX(0) rotate(0)}100%{transform:translateY(112vh) translateX(var(--drift,20px)) rotate(200deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.app{position:relative;z-index:1;width:min(760px,100%);margin:auto;padding:8px 16px 14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:clamp(18px,5vw,26px);font-weight:900;letter-spacing:.5px;color:var(--deep)}
.brand svg{width:32px;height:32px;flex:none}
.headerBtns{display:flex;gap:8px;flex-wrap:wrap}
.restart{border:0;background:#fff;color:var(--deep);font-weight:800;font-size:13px;padding:7px 12px;border-radius:12px;box-shadow:0 4px 14px #2f7bd133;cursor:pointer;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.restart:active{transform:scale(.96)}
.mascots{display:flex;justify-content:center;gap:14px;margin:0 0 4px}
.mascot{width:44px;height:53px}
.bubble{text-align:center;font-size:13px;font-weight:700;color:var(--deep);background:#fff;border-radius:14px;padding:5px 12px;margin:0 auto 6px;box-shadow:0 4px 14px #2f7bd122;max-width:90%;min-height:16px}
.controlsRow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.segmented{display:inline-flex;background:#eaf6ff;border-radius:14px;padding:3px;gap:4px}
.segBtn{border:0;background:transparent;font:inherit;font-weight:800;font-size:13px;padding:6px 12px;border-radius:10px;cursor:pointer;color:#5f759a;min-height:34px;transition:background .15s,color .15s}
.segBtn.active{background:#fff;color:var(--deep);box-shadow:0 4px 10px #2f7bd133}
.iconToggle{border:0;background:#fff;font:inherit;font-size:13px;font-weight:800;padding:6px 12px;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px #2f7bd122;min-height:34px;color:var(--deep)}
.voiceWarn{display:none;background:#fff4e0;color:#a5661a;border:2px dashed #ffcf5c;border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;text-align:center;margin-bottom:8px}
.voiceWarn.show{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.stat{background:#fff;border-radius:16px;padding:6px;text-align:center;box-shadow:0 4px 16px #2f7bd122}
.stat b{display:block;font-size:18px;color:var(--navy)}
.stat small{color:#6c84a3;font-size:11px;font-weight:700}
.stat.review{background:#fff;position:relative}
.stat.review b{color:var(--pink)}
.bar{height:10px;background:#dcf0ff;border-radius:20px;overflow:hidden;margin:0 2px 6px;position:relative;box-shadow:inset 0 0 0 2px #fff}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--deep));border-radius:20px;transition:width .35s ease}
.crystalTray{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:18px;margin:0 0 6px}
.crystal{font-size:18px;animation:crystalPop .4s ease}
@keyframes crystalPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.card{background:var(--paper);border-radius:24px;padding:12px 16px 12px;box-shadow:0 14px 36px #2f7bd12a;text-align:center;position:relative;border:3px solid #eaf6ff}
.instruction{font-size:14px;color:#5f759a;margin:0 0 4px;font-weight:700}
.target{font-size:clamp(44px,13vw,76px);line-height:1;font-weight:900;color:var(--navy);margin:2px 0 2px;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;min-height:1.1em}
.target .spk{font-size:.28em}
.listenIcon{font-size:1em;display:inline-block;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pinyin{font-size:19px;color:var(--deep);font-weight:800;min-height:24px;margin-bottom:2px}
.replay{border:0;background:linear-gradient(135deg,var(--mint),#49c98b);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:7px 18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 14px #49c98b55;margin:2px 0 8px;min-height:38px}
.replay:active{transform:scale(.96)}
.reveal{min-height:18px;margin:0 0 4px;font-weight:800;font-size:14px;color:var(--deep)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:480px;margin:auto}
.choice{font-family:inherit;font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--navy);border:0;border-radius:20px;min-height:72px;cursor:pointer;position:relative;
  transition:transform .12s,box-shadow .12s,filter .12s;box-shadow:0 8px 0 rgba(0,0,0,.08),0 10px 20px #2f7bd122}
.choice:nth-child(4n+1){background:linear-gradient(160deg,#fff,#d8f2ff)}
.choice:nth-child(4n+2){background:linear-gradient(160deg,#fff,#ffe1ee)}
.choice:nth-child(4n+3){background:linear-gradient(160deg,#fff,#e2f9ef)}
.choice:nth-child(4n+0){background:linear-gradient(160deg,#fff,#ece2ff)}
.choice:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:34%;height:10px;border-radius:6px;background:rgba(255,255,255,.75)}
.choice:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.08),0 6px 14px #2f7bd122}
.choice:focus-visible{outline:3px solid var(--deep)}
.choice.correct{background:linear-gradient(160deg,#fff,#c8f7df)!important;animation:bounce .45s}
.choice.wrong{animation:shake .35s}
.choice.dim{opacity:.35;filter:grayscale(.5)}
.kbdHint{position:absolute;top:6px;right:10px;font-size:11px;font-weight:900;color:#9fb3cf;background:#fff;border-radius:8px;padding:1px 6px;box-shadow:0 2px 6px #2f7bd122;line-height:1.4}
.hint{min-height:20px;margin:6px 0 0;font-weight:800;font-size:14px;color:var(--bad)}
.next{border:0;background:linear-gradient(135deg,var(--deep),#5a9ff0);color:#fff;font:inherit;font-weight:800;font-size:16px;padding:9px 24px;border-radius:16px;cursor:pointer;box-shadow:0 6px 14px #2f7bd155;margin-top:6px;display:none;min-height:40px}
.next.show{display:inline-block}
.tip{font-size:11px;color:#8aa0bd;margin:8px 0 0}
body.short .tip{display:none}
body.short .mascots{display:none}
body.short .bubble{display:none}
@media(max-height:700px){
  .tip{display:none}
  .mascots{display:none}
  .bubble{display:none}
  .app{padding:6px 16px 10px}
  .card{padding:8px 14px 8px}
}
.finish{display:none;padding:22px 8px 14px}
.finish.show{display:block}
.finish h2{font-size:28px;margin:6px 0 10px;color:var(--deep)}
.finish p{font-size:18px;line-height:1.8}
.finish .starRating{font-size:30px;margin:2px 0}
.finish .crystalRow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.again{border:0;background:linear-gradient(135deg,var(--pink),#ff7ab0);color:white;border-radius:18px;padding:14px 28px;font-size:18px;font-weight:800;cursor:pointer;min-height:50px;box-shadow:0 6px 14px #ff7ab055}
.source{font-size:12px;text-align:center;color:#8aa0bd;margin:16px 0 0}
.importPanel{display:none;background:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px;box-shadow:0 4px 16px #2f7bd122;text-align:left}
.importPanel.show{display:block}
.importPanel h3{margin:0 0 10px;font-size:15px;color:var(--deep)}
.importRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.importRow input{flex:1;min-width:84px;padding:9px 10px;border-radius:10px;border:2px solid #dcecff;font:inherit;font-size:14px;min-height:40px}
.importRow input#newChar{flex:0 0 56px;text-align:center;font-size:20px}
.importAdd{border:0;background:var(--deep);color:#fff;font-weight:800;padding:9px 16px;border-radius:12px;cursor:pointer;min-height:40px}
.importMsg{font-size:13px;font-weight:700;min-height:18px;margin:0 0 8px;color:var(--bad)}
.importMsg.ok{color:var(--ok)}
.customList{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.customChip{background:#eaf6ff;border-radius:10px;padding:4px 4px 4px 10px;font-size:13px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:4px}
.customChip button{border:0;background:transparent;color:var(--bad);font-weight:900;cursor:pointer;font-size:15px;line-height:1;padding:2px 6px}
.example{font-size:14px;color:#6c84a3;font-weight:700;min-height:18px;margin:0 0 6px}
.feedbackFab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:40;border:0;background:linear-gradient(135deg,var(--violet),#8f6fe0);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px #6b4fc255;cursor:pointer;min-height:40px}
.feedbackFab:active{transform:scale(.96)}
.feedbackOverlay{position:fixed;inset:0;z-index:70;background:rgba(31,58,95,.45);display:none;align-items:center;justify-content:center;padding:16px}
.feedbackOverlay.show{display:flex}
.feedbackPanel{background:#fff;border-radius:22px;padding:18px 18px 16px;max-width:420px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 18px 40px #1f3a5f33;position:relative;text-align:left}
.feedbackPanel h3{margin:0 0 6px;font-size:18px;color:var(--navy)}
.feedbackSub{font-size:13px;color:#6c84a3;margin:0 0 12px;font-weight:600}
.feedbackClose{position:absolute;top:10px;right:12px;border:0;background:#eef3fb;color:#5f759a;width:30px;height:30px;border-radius:50%;font-size:16px;font-weight:900;cursor:pointer}
.feedbackOptions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fbOption{border:2px solid #eaf0fb;background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:14px;cursor:pointer}
.fbOption.active{background:var(--deep);border-color:var(--deep);color:#fff}
.feedbackMsg{width:100%;min-height:72px;border-radius:12px;border:2px solid #dcecff;padding:10px;font:inherit;font-size:14px;resize:vertical;margin-bottom:12px}
.feedbackVoiceRow{display:flex;align-items:center;gap:10px;margin:-6px 0 12px;flex-wrap:wrap}
.feedbackVoiceBtn{border:2px solid var(--violet);background:#fff;color:var(--violet);font:inherit;font-weight:800;font-size:14px;padding:10px 16px;border-radius:14px;cursor:pointer;min-height:44px;white-space:nowrap}
.feedbackVoiceBtn[aria-pressed="true"]{background:var(--violet);color:#fff}
.feedbackVoiceBtn:disabled{opacity:.5;cursor:not-allowed}
.feedbackVoiceStatus{font-size:12px;color:#6c84a3;font-weight:600;flex:1;min-width:120px}
.feedbackSubmit{width:100%;border:0;background:linear-gradient(135deg,var(--deep),#5a9ff0);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:11px;border-radius:14px;cursor:pointer;min-height:44px}
.feedbackThanks{min-height:18px;margin:10px 0 0;font-weight:800;font-size:13px;color:var(--ok);text-align:center}
.feedbackHistoryLink{text-align:center;margin-top:10px}
.feedbackLinkBtn{border:0;background:transparent;color:var(--deep);font:inherit;font-weight:700;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
.feedbackList{display:flex;flex-direction:column;gap:10px;margin:8px 0 10px;max-height:50vh;overflow:auto}
.feedbackItem{background:#f6f9ff;border-radius:14px;padding:10px 12px}
.feedbackItemHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.feedbackItemHead b{font-size:14px;color:var(--navy)}
.feedbackItemHead small{font-size:11px;color:#8aa0bd}
.feedbackItemMsg{font-size:13px;color:#405a7d;margin:6px 0 4px;white-space:pre-wrap}
.feedbackItemMeta{font-size:11px;color:#9fb3cf}
.feedbackEmpty{font-size:13px;color:#8aa0bd;text-align:center;padding:20px 0}
.feedbackHistoryActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@keyframes bounce{50%{transform:scale(1.08)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.celebrate-layer{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.confetti{position:absolute;top:-10%;animation:confettiFall ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:.15}}
@media(hover:hover){
  .choice:hover{transform:translateY(-3px);box-shadow:0 12px 22px #2f7bd133}
  .segBtn:hover{color:var(--deep)}
  .iconToggle:hover,.replay:hover,.restart:hover,.next:hover,.again:hover{filter:brightness(1.05)}
}
@media(max-width:420px){.app{padding:8px 10px 14px}.card{padding:10px 12px 10px}.choice{min-height:68px;border-radius:17px}.stats{gap:6px;grid-template-columns:repeat(2,1fr)}.stat{padding:6px 4px}.stat b{font-size:16px}.mascot{width:40px;height:48px}.kbdHint{display:none}}
</style>
</head>
<body class="theme-ice">
<div id="sky" aria-hidden="true"></div>
<button class="feedbackFab" id="feedbackFab" aria-haspopup="dialog">💬 我想说</button>
<main class="app">
  <header class="top">
    <div class="brand">
      <span id="brandIconWrap"></span>
      <span id="brandTitle">一年级学习乐园 · 认字游戏</span>
    </div>
    <div class="headerBtns">
      <a class="restart" href="../" aria-label="返回一年级学习乐园入口">⌂ 学习入口</a>
      <button class="restart" id="restart">↻ 重新开始</button>
      <button class="restart" id="toggleImport" aria-expanded="false">➕ 添加生字</button>
      <button class="restart" id="clearMastery" title="清除本机保存的错题记录">🧹 清除记录</button>
    </div>
  </header>

  <div class="mascots" id="mascotWrap"></div>
  <p class="bubble" id="bubble">你好呀，一起来认字吧！</p>

  <div class="controlsRow">
    <div class="segmented" role="group" aria-label="选择认字模式">
      <button class="segBtn active" id="modeRead" aria-pressed="true">看字认读</button>
      <button class="segBtn" id="modeListen" aria-pressed="false">听音辨字</button>
      <button class="segBtn" id="modePinyin" aria-pressed="false">拼音跟读</button>
    </div>
    <button class="iconToggle" id="sfxToggle" aria-pressed="false">🔕 音效</button>
  </div>
  <p class="voiceWarn" id="voiceWarning" role="alert"></p>

  <section class="importPanel" id="importPanel">
    <h3>添加新的生字（汉字 + 拼音，例词可选）</h3>
    <div class="importRow">
      <input id="newChar" maxlength="1" placeholder="字" aria-label="新字（一个汉字）">
      <input id="newPinyin" placeholder="拼音，如 xué" aria-label="拼音">
      <input id="newExample" placeholder="例词（可选），如 学校" aria-label="例词（可选）">
      <button class="importAdd" id="addWordBtn">添加</button>
    </div>
    <p class="importMsg" id="importMsg" role="status"></p>
    <div class="customList" id="customList" aria-label="已添加的生字"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="score">0</b><small>得分</small></div>
    <div class="stat"><b id="streak">0</b><small>连续答对</small></div>
    <div class="stat"><b><span id="round">1</span>/10</b><small>当前题目</small></div>
    <div class="stat review" id="reviewStat" title="经常答错、需要多练习的字"><b id="reviewCount">0</b><small>重点复习</small></div>
  </section>
  <div class="bar"><i id="progress"></i></div>
  <div class="crystalTray" id="crystals" aria-label="收集到的奖励"></div>

  <section class="card" id="game">
    <p class="instruction" id="instruction">听一听、看拼音，找出这个字</p>
    <div class="target" id="target" role="button" tabindex="0" aria-label="点击朗读这个字"></div>
    <p class="pinyin" id="pinyin"></p>
    <p class="example" id="exampleText"></p>
    <button class="replay" id="replay">🔁 再听一次</button>
    <button class="replay" id="stopSpeak" aria-label="停止朗读">⏹ 停止</button>
    <button class="replay" id="showPinyinAnswer" style="display:none">✅ 我跟读好了，显示答案</button>
    <p class="reveal" id="reveal"></p>
    <div class="choices" id="choices"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="next" id="next">下一题 →</button>
    <p class="tip">鼠标点字即可作答；键盘也可以：数字 1-4 选答案，空格重播读音，回车进入下一题。经常答错的字会更常出现，帮助多复习。</p>
  </section>

  <section class="card finish" id="finish">
    <div style="font-size:50px" id="finishEmoji">❄️👑⭐</div>
    <h2>认字小能手！</h2>
    <p class="starRating" id="starRating"></p>
    <p>你得了 <b id="finalScore">0</b> 分<br>答对了 <b id="finalCorrect">0</b> / 10 题</p>
    <div class="crystalRow" id="finalCrystals"></div>
    <button class="again" id="again">再玩一次</button>
  </section>

  <p class="source">字表来源：用户提供的识字图片（第7级总字表，仅选用清晰可辨认的字）</p>
</main>

<div class="feedbackOverlay" id="feedbackOverlay" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle" aria-hidden="true">
  <div class="feedbackPanel">
    <button class="feedbackClose" id="feedbackClose" aria-label="关闭">×</button>
    <h3 id="feedbackTitle">我想说</h3>
    <p class="feedbackSub">悄悄告诉我们你的想法吧，爸爸妈妈老师会看到～</p>
    <div class="feedbackOptions" id="feedbackOptions" role="group" aria-label="选一个想法">
      <button class="fbOption" type="button" data-type="太难了">太难了</button>
      <button class="fbOption" type="button" data-type="太简单了">太简单了</button>
      <button class="fbOption" type="button" data-type="声音不好听">声音不好听</button>
      <button class="fbOption" type="button" data-type="题目不好玩">题目不好玩</button>
      <button class="fbOption" type="button" data-type="我想学别的">我想学别的</button>
      <button class="fbOption" type="button" data-type="都挺好">都挺好</button>
    </div>
    <textarea id="feedbackMsg" class="feedbackMsg" maxlength="200" placeholder="（可以不填）想多说几句也可以写在这里～" aria-label="留言"></textarea>
    <div class="feedbackVoiceRow">
      <button class="feedbackVoiceBtn" id="feedbackVoiceBtn" type="button" aria-pressed="false">🎙️ 开始说</button>
      <span class="feedbackVoiceStatus" id="feedbackVoiceStatus">也可以直接说给我听</span>
    </div>
    <button class="feedbackSubmit" id="feedbackSubmit" type="button">说给我听</button>
    <p class="feedbackThanks" id="feedbackThanks" role="status"></p>
    <div class="feedbackHistoryLink">
      <button class="feedbackLinkBtn" id="feedbackHistoryBtn" type="button">查看/导出我说过的话</button>
    </div>
  </div>
</div>

<div class="feedbackOverlay" id="feedbackHistoryOverlay" role="dialog" aria-modal="true" aria-labelledby="feedbackHistoryTitle" aria-hidden="true">
  <div class="feedbackPanel">
    <button class="feedbackClose" id="feedbackHistoryClose" aria-label="关闭">×</button>
    <h3 id="feedbackHistoryTitle">我说过的话</h3>
    <div class="feedbackList" id="feedbackList"></div>
    <div class="feedbackHistoryActions">
      <button class="feedbackLinkBtn" id="feedbackExportBtn" type="button">导出为文件</button>
      <button class="feedbackLinkBtn" id="feedbackClearBtn" type="button">清空记录</button>
    </div>
  </div>
</div>

function exampleOf(char){
  const choices=WORD_EXAMPLES[char];
  if(choices&&choices.length)return choices[Math.floor(Math.random()*choices.length)];
  const hit=getPool().find(x=>x[0]===char&&x[2]);
  return hit?hit[2]:'';
}
function addCustomWord(char,py,example){
  char=(char||'').trim();
  py=(py||'').trim();
  example=(example||'').trim();
  if(!/^[一-鿿]$/.test(char)) return {ok:false,msg:'请输入一个汉字哦～'};
  if(!py) return {ok:false,msg:'请填写拼音～'};
  if(BASE_WORDS.some(x=>x[0]===char)) return {ok:false,msg:'这个字已经在字库里啦，不用重复添加～'};
  const existing=customWords.find(x=>x[0]===char);
  if(existing){ existing[1]=py; existing[2]=example; }
  else{ customWords.push([char,py,example]); }
  saveCustomWords();
  return {ok:true,msg:`已添加「${char}」，下一轮就会出现啦！`};
}
function removeCustomWord(char){
  customWords=customWords.filter(x=>x[0]!==char);

  ).join('');

}
function weightOf(entry){ const miss=mastery[entry[0]]||0; return 1+Math.min(miss,6)*1.5; }
function weightedSample(pool,n){
  const arr=pool.slice();
  const picked=[];
  for(let k=0;k<n&&arr.length;k++){
    const weights=arr.map(weightOf);
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    let idx=arr.length-1;
    for(let i=0;i<arr.length;i++){ r-=weights[i]; if(r<=0){idx=i;break;} }
    picked.push(arr[idx]);
    arr.splice(idx,1);
  }
  return picked;
}

function setupFeedbackVoice(){
  const btn=$('feedbackVoiceBtn'), status=$('feedbackVoiceStatus');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){btn.disabled=true; status.textContent='当前浏览器不支持语音输入，可以直接打字'; return;}
  const rec=new SR(); rec.lang='zh-CN'; rec.continuous=false; rec.interimResults=true;
  rec.onstart=()=>{feedbackListening=true;btn.textContent='⏹️ 说完请点停止';btn.setAttribute('aria-pressed','true');btn.classList.add('listening');status.textContent='正在听，请自然地说…';};
  rec.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript; if(text){const box=$('feedbackMsg');box.value=(box.value?box.value+' ':'')+text.slice(0,200-box.value.length);}};
  rec.onerror=e=>{feedbackListening=false;btn.textContent='🎙️ 开始说';btn.setAttribute('aria-pressed','false');btn.classList.remove('listening');status.textContent=e.error==='not-allowed'?'麦克风权限未打开，可以直接打字':'没有听清，再试一次或直接打字';};
  rec.onend=()=>{feedbackListening=false;btn.textContent='🎙️ 开始说';btn.setAttribute('aria-pressed','false');btn.classList.remove('listening');if(status.textContent==='正在听，请自然地说…')status.textContent='听到了，可以继续补充';};
  btn.onclick=()=>{if(feedbackListening)rec.stop();else{status.textContent='准备听你说…';try{rec.start();}catch(e){status.textContent='请稍等再试，也可以直接打字';}}};
}

  if(!selectedFeedbackType&&!msg){
    $('feedbackThanks').textContent='选一个想法，或者写几句话吧～';
    return;
  }
  const q=currentQuestionInfo();
  const entry={
    id:Date.now()+'-'+Math.random().toString(36).slice(2,8),
    time:new Date().toISOString(),
    type:selectedFeedbackType||'',
    message:msg,
    char:q.char,
    pinyin:q.pinyin,
    theme:currentTheme?currentTheme.key:'',
    mode:mode,
    pageVersion:PAGE_VERSION,
    synced:false
  };
  feedbackList.push(entry);
  saveFeedbackList();
  $('feedbackThanks').textContent='谢谢你，我记下了 💛';
  trySyncFeedback();
  setTimeout(closeFeedback,1200);
}
function trySyncFeedback(){
  const endpoint=CONFIG.feedbackEndpoint;
  if(!endpoint||!/^https:\/\//i.test(endpoint))return;
  const pending=feedbackList.filter(f=>!f.synced);
  if(!pending.length)return;
  pending.forEach(entry=>{
    fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(entry)
    }).then(res=>{
      if(res&&res.ok){
        entry.synced=true;
        saveFeedbackList();
      }
    }).catch(()=>{ /* 网络失败，留在待同步队列里，下次打开页面或网络恢复时再试 */ });
  });
}
function renderFeedbackHistory(){

    const timeStr=isNaN(d)?f.time:d.toLocaleString('zh-CN');
    const q=f.char?`当时在学「${f.char}」${f.pinyin||''}　`:'';
    const syncLabel=CONFIG.feedbackEndpoint?(f.synced?'已同步':'待同步'):'仅保存在本机';
    return `<div class="feedbackItem">
      <div class="feedbackItemHead"><b>${escapeHtml(f.type)||'（只写了留言）'}</b><small>${timeStr}</small></div>
      ${f.message?`<p class="feedbackItemMsg">${escapeHtml(f.message)}</p>`:''}
      <small class="feedbackItemMeta">${q}版本 ${f.pageVersion} · ${syncLabel}</small>
    </div>`;
  }).join('');
}
function exportFeedback(){
  const blob=new Blob([JSON.stringify(feedbackList,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='认字游戏反馈_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);

// 原生桥接：由 Swift/WKWebView 注入 window.webkit.messageHandlers.speak。
// 有原生桥接时优先用它播放（系统 zh-CN 语音，非浏览器 SpeechSynthesis），
// 没有桥接（比如直接用浏览器打开本页）时回退到网页 SpeechSynthesis。
function hasNativeTTS(){
  return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.speak);
}

function pickVoice(){
  if(!('speechSynthesis'in window))return null;
  const voices=speechSynthesis.getVoices();
  if(!voices.length)return null;
  const zh=voices.filter(v=>/^zh/i.test(v.lang));
  if(!zh.length)return null;
  const priorityNames=['Tingting','Ting-Ting','普通话','Mandarin','Mei-Jia'];
  let v=zh.find(v=>v.lang.toLowerCase()==='zh-cn'&&priorityNames.some(n=>v.name.indexOf(n)>-1));
  if(!v)v=zh.find(v=>v.lang.toLowerCase()==='zh-cn');
  if(!v)v=zh[0];
  return v;
}
function updateVoiceWarning(){
  if(hasNativeTTS())return; // 原生语音状态由 setNativeVoiceInfo 单独汇报
  const banner=$('voiceWarning');
  if(!('speechSynthesis'in window)){
    banner.textContent='⚠️ 这个浏览器不支持语音朗读，请换用最新版 Safari 或 Chrome 打开。';
    banner.classList.add('show');
  }else{
    // Android Chrome 可能异步返回空的 voice 列表，但 speechSynthesis
    // 仍然可以使用系统默认中文声音。不能把“列表暂时为空”误报成不支持。
    banner.classList.remove('show');
  }
}
function refreshVoice(){ zhVoice=pickVoice(); updateVoiceWarning(); }
if('speechSynthesis'in window){
  refreshVoice();
  speechSynthesis.onvoiceschanged=refreshVoice;
}else{
  updateVoiceWarning();
}

// 由 Swift 在找到（或没找到）系统中文语音后调用，汇报的是实际选中的 voice 名称，
// 不假定系统一定装了"播音腔"级别的语音。
window.setNativeVoiceInfo=function(label,hasVoice){
  const banner=$('voiceWarning');
  if(!hasVoice){
    banner.textContent='⚠️ 本机没有找到可用的中文语音，请到系统设置→辅助功能→朗读内容 中下载"中文（普通话，中国大陆）"语音；如需稳定的在线高品质发音，需要接入后端 TTS 服务（见下方说明）。';
    banner.classList.add('show');
  }else{
    banner.classList.remove('show');
  }
  console.log('[NativeTTS] 当前使用的系统语音：',label||'(未知)');
};

let pendingSpeakTimer=null;
let autoNextTimer=null, speechTicket=0;
function cancelAutoNext(){
  speechTicket++;
  if(autoNextTimer!==null){clearTimeout(autoNextTimer);autoNextTimer=null;}
}
function speakText(text,kind,onDone){
  cancelAutoNext();
  const ticket=speechTicket;
  const complete=()=>{
    if(ticket!==speechTicket||!onDone)return;
    autoNextTimer=setTimeout(()=>{autoNextTimer=null;if(ticket===speechTicket)onDone();},650);
  };
  if(pendingSpeakTimer){ clearTimeout(pendingSpeakTimer); pendingSpeakTimer=null; }
  if(hasNativeTTS()){
    window.webkit.messageHandlers.speak.postMessage({type:'speak',text:text,kind:kind||'sentence'});
    return;
  }
  if(!('speechSynthesis'in window)){complete();return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=.82;
  if(zhVoice)u.voice=zhVoice;
  u.onend=complete;
  u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')complete();};
  speechSynthesis.speak(u);
}
function speakAfterChime(text,kind,onDone){
  if(!sfxOn){ speakText(text,kind,onDone); return; }
  if(pendingSpeakTimer)clearTimeout(pendingSpeakTimer);
  pendingSpeakTimer=setTimeout(()=>{
    pendingSpeakTimer=null;
    speakText(text,kind,onDone);
  },380);
}
function stopSpeaking(){
  cancelAutoNext();
  if(pendingSpeakTimer){ clearTimeout(pendingSpeakTimer); pendingSpeakTimer=null; }
  if(hasNativeTTS()){
    window.webkit.messageHandlers.speak.postMessage({type:'stop'});
    return;
  }
  if('speechSynthesis'in window)speechSynthesis.cancel();
}
function speakChar(){ speakText(deck[index][0],'char'); }

function playChime(type){
  if(!sfxOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=type==='correct'?[660,880]:[330];
    let t=audioCtx.currentTime;
    notes.forEach(f=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.15,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t);o.stop(t+.2);
      t+=.16;
    });
  }catch(e){}
}
function addCrystal(){
  crystalsCollected++;
  const span=document.createElement('span');
  span.className='crystal';
  const icons=currentTheme.trayIcons;
  span.textContent=icons[Math.floor(Math.random()*icons.length)];
  $('crystals').appendChild(span);
}
function celebrate(){
  const layer=document.createElement('div');
  layer.className='celebrate-layer';
  const icons=currentTheme.confettiIcons;
  for(let i=0;i<26;i++){
    const s=document.createElement('span');
    s.className='confetti';
    s.textContent=icons[Math.floor(Math.random()*icons.length)];
    s.style.left=(Math.random()*100)+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    s.style.animationDelay=(Math.random()*.6)+'s';
    s.style.fontSize=(16+Math.random()*20)+'px';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(),3200);
}
function buildSky(theme){
  const sky=$('sky');sky.innerHTML='';
  for(let i=0;i<16;i++){
    const f=document.createElement('span');
    f.className='flake';f.textContent=theme.flakeChar;
    f.style.color=theme.flakeColors[Math.floor(Math.random()*theme.flakeColors.length)];
    f.style.left=(Math.random()*100)+'vw';
    f.style.fontSize=(14+Math.random()*18)+'px';
    f.style.setProperty('--drift',(Math.random()*60-30)+'px');
    f.style.animationDuration=(9+Math.random()*10)+'s';
    f.style.animationDelay=(Math.random()*10)+'s';
    sky.appendChild(f);
  }
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.className='star';s.textContent='✦';
    s.style.left=(Math.random()*100)+'vw';
    s.style.top=(Math.random()*90)+'vh';
    s.style.fontSize=(10+Math.random()*12)+'px';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*4)+'s';
    sky.appendChild(s);
  }
}
function applyTheme(theme){
  currentTheme=theme;
  document.body.className='theme-'+theme.key;
  document.title=theme.title;
  $('brandTitle').textContent=theme.title;
  $('brandIconWrap').innerHTML=theme.icon;
  $('mascotWrap').innerHTML=theme.mascotsHTML;
  buildSky(theme);
}
function setMode(m){
  if(mode===m)return;
  mode=m;
  $('modeRead').classList.toggle('active',m==='read');
  $('modeRead').setAttribute('aria-pressed',m==='read');
  $('modeListen').classList.toggle('active',m==='listen');
  $('modeListen').setAttribute('aria-pressed',m==='listen');
  $('modePinyin').classList.toggle('active',m==='pinyin');
  $('modePinyin').setAttribute('aria-pressed',m==='pinyin');
  start();
}
function start(){
  stopSpeaking();
  applyTheme(Math.random()<.5?THEMES.ice:THEMES.toy);
  deck=weightedSample(getPool(),ROUND_LEN);
  index=0;score=0;streak=0;correct=0;crystalsCollected=0;
  $('crystals').innerHTML='';
  $('finish').classList.remove('show');
  $('game').style.display='block';
  $('bubble').textContent=currentTheme.greet;
  render();
}
function render(){
  answered=false;
  const [char,py]=deck[index];
  $('round').textContent=index+1;
  $('score').textContent=score;
  $('streak').textContent=streak;
  $('progress').style.width=(index/ROUND_LEN*100)+'%';
  $('hint').textContent='';
  $('reveal').textContent='';
  $('next').classList.remove('show');
  $('showPinyinAnswer').style.display=mode==='pinyin'?'inline-block':'none';
  if(mode==='read'){
    $('instruction').textContent='听一听、看拼音，找出这个字';
    $('target').innerHTML=`<span id="targetChar">${char}</span><span class="spk">🔊</span>`;
    $('pinyin').textContent=py;
    $('pinyin').style.visibility='visible';
    const ex=exampleOf(char);
    $('exampleText').textContent=ex?`组词：${ex}`:'';
  }else if(mode==='listen'){
    $('instruction').textContent='先听一听读音，再选出正确的字';
    $('target').innerHTML=`<span class="listenIcon">🔊</span>`;
    $('pinyin').textContent='？？';
    $('pinyin').style.visibility='hidden';
    $('exampleText').textContent='';
  }else{
    $('instruction').textContent='先看拼音，跟着读一遍，再看正确答案';
    $('target').innerHTML=`<span class="listenIcon">🔤</span>`;
    $('pinyin').textContent=py;
    $('pinyin').style.visibility='visible';
    $('exampleText').textContent='请大声读：'+py;
  }
  const pool=getPool().filter(x=>x[0]!==char&&x[1]!==py);
  const others=shuffle(pool).slice(0,3);
  const opts=shuffle([[char,py],...others]);
  $('choices').style.display=mode==='pinyin'?'none':'grid';
  $('choices').innerHTML=opts.map(([c],i)=>`<button class="choice" data-char="${c}"><span class="kbdHint">${i+1}</span>${c}</button>`).join('');
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b));
  const renderedDeck=deck, renderedIndex=index;
  setTimeout(()=>{if(deck===renderedDeck&&index===renderedIndex&&!answered){
    if(mode==='pinyin') speakText(py,'pinyin'); else speakChar();
  }},250);
  syncTouchBarAnswers();
}
function syncTouchBarAnswers(){
  if(!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.answers))return;
  const values=[...document.querySelectorAll('.choice')].map(b=>b.dataset.char);
  window.webkit.messageHandlers.answers.postMessage({type:'answers',values:values});
}
function choose(btn){
  if(answered)return;
  const [char,py]=deck[index];
  if(btn.dataset.char===char){
    answered=true;
    btn.classList.add('correct');
    score+=10+streak*2;
    streak++;correct++;
    addCrystal();
    recordCorrect(char);
    $('bubble').textContent=currentTheme.cheers[Math.floor(Math.random()*currentTheme.cheers.length)];
    if(mode==='listen'){
      $('pinyin').style.visibility='visible';
      $('pinyin').textContent=py;
      $('target').innerHTML=`<span id="targetChar">${char}</span><span class="spk">🔊</span>`;
      const ex=exampleOf(char);
      $('reveal').textContent=`原来是：${char}（${py}）`+(ex?`　组词：${ex}`:'');
    }
    $('next').classList.add('show');
    $('score').textContent=score;
    $('streak').textContent=streak;
    $('progress').style.width=((index+1)/ROUND_LEN*100)+'%';
    document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
    playChime('correct');
    const answerExample=exampleOf(char);
    const answerText=`答对了，这个字是${char}`+(answerExample?`，组词${answerExample}`:'');
    $('reveal').textContent=`原来是：${char}（${py}）`+(answerExample?`　组词：${answerExample}`:'');
    const answeredIndex=index;
    speakAfterChime(answerText,'praise',()=>{if(answered&&index===answeredIndex)next();});
  }else{
    btn.classList.add('wrong','dim');
    btn.disabled=true;
    streak=0;
    recordWrong(char);
    $('streak').textContent=streak;
    $('hint').textContent= mode==='read' ? ('再想一想，看看拼音：'+py+' ～') : '再仔细听一听，点一点喇叭再听一次吧';
    $('bubble').textContent=currentTheme.wrongBubble;
    playChime('wrong');
    speakAfterChime('再试一次','retry');
    setTimeout(()=>btn.classList.remove('wrong'),400);
  }
}
function revealPinyinAnswer(){
  if(mode!=='pinyin'||answered)return;
  const [char,py]=deck[index];
  answered=true;
  $('target').innerHTML=`<span id="targetChar">${char}</span><span class="spk">🔊</span>`;
  const ex=exampleOf(char);
  $('reveal').textContent=`正确答案：${char}（${py}）`+(ex?`　组词：${ex}`:'');
  $('showPinyinAnswer').style.display='none';
  $('next').classList.add('show');
  $('bubble').textContent='跟读完成，看看答案对不对！';
  speakText(`正确答案是${char}，拼音是${py}`,'praise');
}
function next(){
  if(!answered)return;
  stopSpeaking();
  if(index===ROUND_LEN-1){
    $('game').style.display='none';
    $('finish').classList.add('show');
    $('finalScore').textContent=score;
    $('finalCorrect').textContent=correct;
    const ratio=correct/ROUND_LEN;
    const stars=ratio>=.9?3:ratio>=.6?2:1;
    $('starRating').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    $('finalCrystals').innerHTML=$('crystals').innerHTML;
    $('finishEmoji').textContent=currentTheme.finishEmoji;
    $('bubble').textContent=currentTheme.finishGreet+' 🎉';
    speakText(currentTheme.finishGreet,'finish');
    celebrate();
    return;
  }
  index++;render();
}
function speakCurrent(){
  const [char,py]=deck[index];
  if(mode==='pinyin') speakText(py,'pinyin'); else speakChar();
}
$('target').onclick=speakCurrent;
$('target').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();speakChar();}};
$('replay').onclick=speakCurrent;
$('stopSpeak').onclick=stopSpeaking;
$('next').onclick=next;

$('modePinyin').onclick=()=>setMode('pinyin');

$('feedbackFab').onclick=openFeedback;
$('feedbackClose').onclick=closeFeedback;
$('feedbackOverlay').onclick=e=>{ if(e.target.id==='feedbackOverlay')closeFeedback(); };
document.querySelectorAll('.fbOption').forEach(b=>{

$('feedbackSubmit').onclick=submitFeedback;
setupFeedbackVoice();
$('feedbackHistoryBtn').onclick=()=>{ closeFeedback(); openFeedbackHistory(); };
$('feedbackHistoryClose').onclick=closeFeedbackHistory;
$('feedbackHistoryOverlay').onclick=e=>{ if(e.target.id==='feedbackHistoryOverlay')closeFeedbackHistory(); };
$('feedbackExportBtn').onclick=exportFeedback;
$('feedbackClearBtn').onclick=()=>{
  if(confirm('确定要清空保存在这台电脑上的留言记录吗？')){
    feedbackList=[];
    saveFeedbackList();
    renderFeedbackHistory();
  }
};
$('sfxToggle').onclick=()=>{
  sfxOn=!sfxOn;
  $('sfxToggle').textContent=sfxOn?'🔔 音效':'🔕 音效';
  $('sfxToggle').setAttribute('aria-pressed',sfxOn);
  if(sfxOn)playChime('correct');
};
function adjustForWindowHeight(){
  document.body.classList.toggle('short',window.innerHeight<620);
}
window.addEventListener('resize',adjustForWindowHeight);
adjustForWindowHeight();
document.addEventListener('keydown',e=>{
  const typing=e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA');
  const feedbackOpen=$('feedbackOverlay').classList.contains('show')||$('feedbackHistoryOverlay').classList.contains('show');
  if(feedbackOpen){
    if(e.key==='Escape'){ e.preventDefault(); closeFeedback(); closeFeedbackHistory(); }
    return;
  }
  if(typing)return;
  if($('finish').classList.contains('show'))return;
  if(e.key>='1'&&e.key<='4'){
    const btns=[...document.querySelectorAll('.choice')];
    const i=+e.key-1;
    if(btns[i]&&!btns[i].disabled){e.preventDefault();choose(btns[i]);}
  }else if(e.key==='Enter'){
    if($('next').classList.contains('show')){e.preventDefault();next();}
  }else if(e.key===' '||e.code==='Space'){
    e.preventDefault();speakChar();
  }else if(e.key==='Escape'){
    e.preventDefault();stopSpeaking();
  }
});
updateReviewStat();
start();
trySyncFeedback();
window.addEventListener('online',trySyncFeedback);

/* Touch Bar 原生按钮桥接：由 WKWebView.evaluateJavaScript 调用，不影响鼠标/键盘原有玩法 */
window.TouchBar={
  choose:function(n){
    var btns=document.querySelectorAll('.choice');
    var btn=btns[n-1];
    if(btn&&!btn.disabled)choose(btn);
  },
  replay:function(){ speakChar(); },
  next:function(){ if($('next').classList.contains('show'))next(); },
  syncNow:syncTouchBarAnswers
};
